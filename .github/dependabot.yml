# Actualizaciones mensuales de dependencias. Los PR van a develop (el flujo es feature → develop → main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Minor y patch juntos en un solo PR; los major llegan de a uno.
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Los major de Next traen cambios que rompen: se migran a mano.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      # Los tipos siguen la versión de Node del proyecto, no la última.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # ESLint 10 rompe eslint-plugin-react (lo trae eslint-config-next 16): se migra cuando Next lo soporte.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7 falla el typecheck y el build de Next 16: se migra cuando Next lo soporte.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
